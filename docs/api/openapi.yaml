            $ref: '#/components/schemas/PlannerHandoffSelectedItem'

    HomeInputParseResponse:
      type: object
      required: [type, original_text]
      properties:
        type: { type: string, enum: [xhs_link, trip_params, unknown] }
        original_text: { type: string }
        links:
          type: array
          description: Distinct supported links in input order. url is the legacy basic normalized URL; original_url is the exact cleaned single-link input to preserve for owner-only import detail.
          items:
            type: object
            required: [url, position]
            properties:
              url: { type: string, format: uri }
              original_url: { type: string, format: uri }
              position: { type: integer, minimum: 0 }
        duplicate_count: { type: integer, minimum: 0 }
        link_occurrences:
          type: array
          description: Every recognized URL occurrence, including duplicates; position is the UTF-16 offset in original_text.
          items:
            type: object
            required: [url, position]
            properties:
              url: { type: string, format: uri }
              position: { type: integer, minimum: 0 }
        unrecognized:
          type: array
          items:
            type: object
            required: [text, reason]
            properties:
              text: { type: string }
              reason: { type: string, enum: [unsupported_url, not_a_link] }
        url: { type: string, format: uri, nullable: true }
        warning:
          nullable: true
          $ref: '#/components/schemas/IngestWarning'
        trip_params:
          nullable: true
          $ref: '#/components/schemas/HomeTripParams'
        planner_handoff:
          nullable: true
          $ref: '#/components/schemas/PlannerHandoff'

    LibraryCitySummary:
