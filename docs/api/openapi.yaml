        wake_preference: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', nullable: true }
        morning_start_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', nullable: true }
        first_day_arrival_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', nullable: true }
        last_day_departure_time: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', nullable: true }
