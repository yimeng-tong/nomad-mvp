        leave_blank: { type: boolean, default: false }

    PlanLuggagePlan:
      type: object
      properties:
        mode: { type: string, enum: [carry_with_me, hotel_storage, station_storage, courier, undecided], default: undecided }
        notes: { type: string, maxLength: 500, nullable: true }
        hotel_change_help_needed: { type: boolean, default: false }

    PlanHardTimeHint:
      type: object
      required: [item_id, time_hint, source]
      properties:
        item_id: { type: string }
        poi_id: { type: string, nullable: true }
        time_hint:
          $ref: '#/components/schemas/PlannerTimeHint'
        source: { type: string, enum: [uploaded_inspiration, user_selected] }

    IngestStartRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, enum: [xhs] }
        share_text: { type: string, nullable: true }
        url: { type: string, format: uri, nullable: true }
        force: { type: boolean, description: 'Bypass idempotency (admin/feature-flag)' }

    IngestSequence:
      type: string
      maxLength: 19
      pattern: '^(0|[1-9][0-9]{0,18})$(?![\s\S])'
      description: Canonical decimal PostgreSQL bigint from 0 through 9223372036854775807. Never coerce through a JavaScript Number.
    IngestCursor:
      type: string
      maxLength: 128
      pattern: '^i1:[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}:(0|[1-9][0-9]{0,18})$(?![\s\S])'
      description: Public per-job log namespace plus decimal seq, not an authentication credential. Bare 0, leading zeros, duplicates and out-of-range values are invalid.
    IngestRecoveryResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, ingest_id, cursor, head_cursor, head_seq, replay_floor]
          properties:
            mode: { type: string, enum: [replay] }
            ingest_id: { type: string }
            cursor: { $ref: '#/components/schemas/IngestCursor' }
            head_cursor: { $ref: '#/components/schemas/IngestCursor' }
            head_seq: { $ref: '#/components/schemas/IngestSequence' }
            replay_floor: { $ref: '#/components/schemas/IngestSequence' }
        - type: object
          additionalProperties: false
          required: [mode, reason, ingest_id, cursor, head_cursor, head_seq, replay_floor, snapshot]
          properties:
            mode: { type: string, enum: [resync] }
            reason: { type: string, enum: [retention, checkpoint_missing] }
            ingest_id: { type: string }
            cursor: { $ref: '#/components/schemas/IngestCursor' }
            head_cursor: { $ref: '#/components/schemas/IngestCursor' }
            head_seq: { $ref: '#/components/schemas/IngestSequence' }
            replay_floor: { $ref: '#/components/schemas/IngestSequence' }
            snapshot: { $ref: '#/components/schemas/IngestSnapshot' }
    IngestControl:
      type: object
      additionalProperties: false
      required: [kind, ingest_id, cursor, attempt, state_version]
      properties:
        kind: { type: string, enum: [complete, resync] }
        ingest_id: { type: string }
        cursor: { $ref: '#/components/schemas/IngestCursor' }
        attempt: { type: integer, minimum: 1 }
        state_version: { type: integer, minimum: 0 }
      description: A no-id control frame, processed after prior business frames. Resync instructs a protected recovery read; complete only ends the current confirmed head, never an older attempt.
    IngestDurableEvent:
      allOf:
        - $ref: '#/components/schemas/IngestEvent'
        - type: object
          required: [schema_version, kind, seq, cursor, stage, occurred_at, attempt, state_version, snapshot]
          properties:
            schema_version: { type: integer, enum: [1] }
            kind: { type: string, enum: [fact, checkpoint] }
            seq: { $ref: '#/components/schemas/IngestSequence' }
            cursor: { $ref: '#/components/schemas/IngestCursor' }
            stage: { type: string, enum: [created, fetching, parsing, geo, storing, done, failed] }
            occurred_at: { type: string, format: date-time }
            attempt: { type: integer, minimum: 1 }
            state_version: { type: integer, minimum: 0 }
            snapshot: { $ref: '#/components/schemas/IngestSnapshot' }
            sub_stage: { type: string, enum: [media_prep, speech_detect, frame_extract, asr, multimodal], nullable: true }
          description: Immutable stored facts. Checkpoint is an explicit legacy baseline, not fabricated past stages. stage and state agree; seq spans all user attempts of this job.
    IngestSnapshot:
      type: object
      description: Current committed facts. state_version orders snapshots and differs from durable seq. head_cursor is only a current-head hint; ordinary snapshot reads must not acknowledge unconsumed events.
      required: [ingest_id, attempt, state_version, state, source_title, result, partial, retriable, updated_at, actions]
      properties:
        head_cursor: { $ref: '#/components/schemas/IngestCursor' }
        sub_stage: { type: string, enum: [media_prep, speech_detect, frame_extract, asr, multimodal], nullable: true }
        ingest_id: { type: string }
        attempt: { type: integer, minimum: 1 }
        state_version: { type: integer, minimum: 0 }
        state: { type: string, enum: [created, fetching, parsing, geo, storing, done, failed] }
        source_title: { type: string, nullable: true, maxLength: 240 }
        fetched_count: { type: integer, minimum: 0, nullable: true }
        parsed_count: { type: integer, minimum: 0, nullable: true }
        candidate_count: { type: integer, minimum: 0, nullable: true, description: Actual saved candidate records once a result is committed; unknown before persistence. }
        stored_count: { type: integer, minimum: 0, nullable: true }
        partial: { type: boolean }
        retriable: { type: boolean }
        error_code: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
        result:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/IngestResultSummary'
        actions:
          type: object
          required: [retry, view]
          properties:
            retry: { type: boolean }
            view: { type: boolean }
    IngestResultSummary:
      type: object
      required: [inspiration_id, locate_status, asset_count, city_name]
      properties:
        inspiration_id: { type: string }
        locate_status: { type: string, enum: [resolved, pending] }
        asset_count: { type: integer, minimum: 0 }
        city_name: { type: string, nullable: true }
    IngestAcceptedResponse:
      allOf:
        - $ref: '#/components/schemas/IngestStartResponse'
        - type: object
          required: [operation_id, disposition, snapshot]
          properties:
            operation_id: { type: string, format: uuid }
            disposition: { type: string, enum: [created, reused, retried] }
            snapshot: { $ref: '#/components/schemas/IngestSnapshot' }
    IngestRetryRequest:
      type: object
      additionalProperties: false
      required: [operation_id, expected_attempt, expected_state_version]
      properties:
        operation_id: { type: string, format: uuid }
        expected_attempt: { type: integer, minimum: 1 }
        expected_state_version: { type: integer, minimum: 0 }

    IngestStartResponse:
      type: object
      description: Legacy compatible base. The canonical ingest endpoint returns the required version-2 accepted response below.
      required: [ingest_id, state, sse_url]
      properties:
        operation_id: { type: string, format: uuid }
        disposition: { type: string, enum: [created, reused, retried] }
        snapshot: { $ref: '#/components/schemas/IngestSnapshot' }
        ingest_id: { type: string }
        state: { type: string, enum: [created, fetching, parsing, geo, storing, done, failed] }
        sse_url: { type: string, example: '/ingest/ing_123/events' }
        warning:
          $ref: '#/components/schemas/IngestWarning'

    IngestWarning:
      type: object
      required: [code, message, extra_count]
      properties:
        code: { type: string, enum: [INGEST_SINGLE_LINK_ONLY] }
        message: { type: string, example: '一次仅处理一条链接，其余请逐条粘贴' }
        extra_count: { type: integer, minimum: 1 }

    IngestXhsRequest:
      type: object
      description: Provide either the original single url or share_text containing a Xiaohongshu URL. The selected raw URL is bound to the durable operation and protected for owner-only detail; other share text and links are not persisted as that original URL.
      anyOf:
        - required: [url]
        - required: [share_text]
      properties:
        operation_id: { type: string, format: uuid, description: Retain this owner-scoped operation across an unknown acceptance; new clients always supply it. }
        url: { type: string, format: uri, nullable: true }
        share_text: { type: string, nullable: true }

    IngestEvent:
      type: object
      required: [trace_id, ingest_id, state, ts]
      properties:
        snapshot: { $ref: '#/components/schemas/IngestSnapshot' }
        attempt: { type: integer, minimum: 1 }
        state_version: { type: integer, minimum: 0 }
        trace_id: { type: string }
        ingest_id: { type: string }
        state: { type: string, enum: [created, fetching, parsing, geo, storing, done, failed] }
        sub_stage: { type: string, enum: [media_prep, speech_detect, frame_extract, asr, multimodal, text, ocr, vision], nullable: true, description: Legacy text/ocr/vision values are accepted only when reading old wire events. New durable writes use the canonical five stages. }
        retry: { type: integer, minimum: 0 }
        fetched_count: { type: integer, minimum: 0 }
        parsed_count: { type: integer, minimum: 0 }
        candidate_count: { type: integer, minimum: 0 }
        stored_count: { type: integer, minimum: 0 }
        error_code: { type: string, nullable: true }
        error_message: { type: string, nullable: true }
        retriable: { type: boolean, nullable: true }
        ts: { type: integer }

    PlanGenerateRequest:
      type: object
      required: [city, start_date, days, pace]
      properties:
        city: { type: string }
        start_date: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 14 }
        pace: { type: string, enum: [tight, comfortable] }
