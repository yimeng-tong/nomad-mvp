        '409': { $ref: '#/components/responses/Error409' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Session created
          headers:
            X-Device-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpVerifyResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

  /auth/native/otp/start:
    post:
      tags: [Auth]
      summary: Start OTP flow (SMS)
      operationId: native_authOtpStart
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpStartRequest' }
      parameters:
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - $ref: '#/components/parameters/NativeAudience'
        - $ref: '#/components/parameters/NativeBinding'
      responses:
        '409': { $ref: '#/components/responses/Error409' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: OTP send status or captcha requirement
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpStartResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '403': { $ref: '#/components/responses/Error403' }
        '429':
          $ref: '#/components/responses/Error429'


  /auth/native/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP and create session
      operationId: native_authOtpVerify
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OtpVerifyRequest' }
      parameters:
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - $ref: '#/components/parameters/NativeAudience'
        - $ref: '#/components/parameters/NativeBinding'
      responses:
        '409': { $ref: '#/components/responses/Error409' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Session created
          headers:
            X-Device-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NativeOtpVerifyResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '429': { $ref: '#/components/responses/Error429' }

