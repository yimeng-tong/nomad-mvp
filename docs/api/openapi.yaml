        kind: { type: string, enum: [quick, hq] }
        state: { type: string, enum: [running, ready, failed, adopted] }
        created_at: { type: string, format: date-time }

    HqJobSummary:
      type: object
      required: [hq_job_id, state]
      properties:
        hq_job_id: { type: string }
        state: { type: string, enum: [running, done, failed] }
        version_id: { type: string, nullable: true }
        error_code: { type: string, nullable: true }

    DayPlanResponse:
      type: object
      required: [plan_id, city, start_date, days, pace, plan_rev, current_version_id, quick_version, versions, day_plans, candidates, warnings, unresolved_required]
      properties:
        plan_id: { type: string }
        city: { type: string }
        start_date: { type: string, format: date }
        days: { type: integer, minimum: 1, maximum: 14 }
        pace: { type: string, enum: [tight, comfortable] }
        plan_rev: { type: integer, minimum: 1 }
        current_version_id: { type: string }
        quick_version:
          $ref: '#/components/schemas/PlanVersionSummary'
        hq_job:
          allOf:
            - $ref: '#/components/schemas/HqJobSummary'
          nullable: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/PlanVersionSummary'
        day_plans:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanDay'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanCandidate'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/DayPlanWarning'
        unresolved_required:
          type: array
          items:
            $ref: '#/components/schemas/UnresolvedRequiredItem'
        seed_undo_token: { type: string, nullable: true }
        seed_undo_expires_at: { type: string, format: date-time, nullable: true }

    EmptySlotResolveRequest:
      oneOf:
        - type: object
          required: [op, expected_plan_rev, candidate_id]
          properties:
            op: { type: string, enum: [fill_empty_slot_with_candidate] }
            expected_plan_rev: { type: integer, minimum: 1 }
            candidate_id: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          required: [op, expected_plan_rev]
          properties:
            op: { type: string, enum: [set_free_activity] }
            expected_plan_rev: { type: integer, minimum: 1 }
          additionalProperties: false

    EmptySlotResolveResponse:
      type: object
      required: [plan_id, plan_rev, slot]
      properties:
        plan_id: { type: string }
        plan_rev: { type: integer, minimum: 1 }
        slot:
          $ref: '#/components/schemas/DayPlanSlot'

    PlanRevisionRequest:
      type: object
      required: [expected_plan_rev]
      properties:
        expected_plan_rev: { type: integer, minimum: 1 }

    SeedUndoRequest:
      type: object
      required: [expected_plan_rev, undo_token]
      properties:
        expected_plan_rev: { type: integer, minimum: 1 }
        undo_token: { type: string }

    PlanMutationResponse:
      type: object
      required: [plan_id, plan_rev]
      properties:
        plan_id: { type: string }
        plan_rev: { type: integer, minimum: 1 }

    HqStartRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }

    HqStartResponse:
      type: object
      required: [hq_job_id, state]
      properties:
        hq_job_id: { type: string }
        state: { type: string, enum: [running, done, failed] }

    HqStatusResponse:
      type: object
      required: [hq_job_id, state]
      properties:
        hq_job_id: { type: string }
        state: { type: string, enum: [running, done, failed] }
        plan_id: { type: string }
        version_id: { type: string, nullable: true }
        error_code: { type: string, nullable: true }
        retriable: { type: boolean, nullable: true }

    HqAdoptRequest:
      type: object
      required: [plan_id, hq_job_id, expected_plan_rev]
      properties:
        plan_id: { type: string }
        hq_job_id: { type: string }
        expected_plan_rev: { type: integer, minimum: 1 }

    HqAdoptResponse:
      type: object
      required: [plan_id, plan_rev, current_version_id]
      properties:
        plan_id: { type: string }
        plan_rev: { type: integer, minimum: 1 }
        current_version_id: { type: string }

    SlotEditRequest:
      oneOf:
        - type: object
          required: [op, expected_plan_rev, operation_id, candidate_id]
          properties:
            op: { type: string, enum: [replace] }
            expected_plan_rev: { type: integer, minimum: 1 }
            operation_id: { type: string, minLength: 8, maxLength: 128 }
            candidate_id: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          required: [op, expected_plan_rev, operation_id, target_day_index]
          properties:
            op: { type: string, enum: [move_day] }
            expected_plan_rev: { type: integer, minimum: 1 }
            operation_id: { type: string, minLength: 8, maxLength: 128 }
            target_day_index: { type: integer, minimum: 0, maximum: 13 }
          additionalProperties: false
        - type: object
          required: [op, expected_plan_rev, operation_id, target_day_index, start_local, end_local]
          properties:
            op: { type: string, enum: [retime] }
            expected_plan_rev: { type: integer, minimum: 1 }
            operation_id: { type: string, minLength: 8, maxLength: 128 }
            target_day_index: { type: integer, minimum: 0, maximum: 13 }
            start_local: { type: string, pattern: '^([01][0-9]|2[0-3]):(00|15|30|45)$' }
            end_local: { type: string, pattern: '^([01][0-9]|2[0-3]):(00|15|30|45)$' }
          additionalProperties: false
        - type: object
          required: [op, expected_plan_rev, operation_id]
          properties:
            op: { type: string, enum: [delete] }
            expected_plan_rev: { type: integer, minimum: 1 }
            operation_id: { type: string, minLength: 8, maxLength: 128 }
          additionalProperties: false

    SlotEditResponse:
      type: object
      required: [plan_id, plan_rev, current_version_id, edit_event_id, undo_token, undo_expires_at, changed_slot]
      properties:
        plan_id: { type: string }
        plan_rev: { type: integer, minimum: 1 }
        current_version_id: { type: string }
        edit_event_id: { type: string }
        undo_token: { type: string }
        undo_expires_at: { type: string, format: date-time }
        changed_slot:
          $ref: '#/components/schemas/DayPlanSlot'

    PlanRecentAction:
      type: object
      required: [edit_event_id, kind, day_index, slot_id, label, can_undo, created_at]
      properties:
        edit_event_id: { type: string }
        kind: { type: string, enum: [replace, move_day, retime, delete] }
        day_index: { type: integer, minimum: 0 }
        slot_id: { type: string }
        label: { type: string, maxLength: 40 }
        can_undo: { type: boolean }
        created_at: { type: string, format: date-time }

    PlanRecentActionResponse:
      type: object
      required: [plan_id, plan_rev]
      properties:
        plan_id: { type: string }
        plan_rev: { type: integer, minimum: 1 }
        action:
          allOf:
            - $ref: '#/components/schemas/PlanRecentAction'
          nullable: true

    PlanEditUndoRequest:
      oneOf:
        - type: object
          required: [expected_plan_rev, undo_token]
          properties:
            expected_plan_rev: { type: integer, minimum: 1 }
            undo_token: { type: string, minLength: 1 }
          additionalProperties: false
        - type: object
          required: [expected_plan_rev, edit_event_id]
          properties:
            expected_plan_rev: { type: integer, minimum: 1 }
            edit_event_id: { type: string, minLength: 1 }
          additionalProperties: false

    PlanEditUndoResponse:
      type: object
      required: [plan_id, plan_rev, current_version_id, undo_event_id, undone_edit_event_id]
      properties:
        plan_id: { type: string }
        plan_rev: { type: integer, minimum: 1 }
        current_version_id: { type: string }
        undo_event_id: { type: string }
        undone_edit_event_id: { type: string }

    AiFillRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        dry_run: { type: boolean, default: false }

    AiFillResponse:
      type: object
      required: [fill_run_id]
      properties:
        fill_run_id: { type: string }
        sse_url: { type: string, example: '/sse/fill/fr_1' }

    ExportPngRequest:
      type: object
      required: [plan_id]
      properties:
        plan_id: { type: string }
        width_px: { type: integer, enum: [1080, 1242], default: 1080 }
        slice_by_day: { type: boolean, default: true }
        theme: { type: string, enum: [light, dark], default: light }

    ExportPngResponse:
      type: object
      required: [files]
      properties:
        files:
          type: array
          items:
            type: object
            required: [url]
            properties:
              day: { type: integer, minimum: 1, nullable: true }
              url: { type: string, format: uri }
        format: { type: string, enum: [webp, jpeg] }
        fallback_reason: { type: string, nullable: true }

    SlotRecommendation:
      type: object
      properties:
        do: { type: string, nullable: true }
        prepare: { type: string, nullable: true }
        notice: { type: string, nullable: true }
        source: { type: string, enum: [ai, override], default: ai }

    ResultSheetResponse:
      type: object
      required: [plan_id, days]
      properties:
        plan_id: { type: string }
        days:
          type: array
          items:
            type: object
            required: [day, slots]
            properties:
              day: { type: integer, minimum: 1 }
              hotel:
                type: object
                nullable: true
                properties:
                  name: { type: string }
                  address: { type: string }
                  map_url: { type: string, nullable: true }
              slots:
                type: array
                items:
                  type: object
                  required: [slot_id, type, start, end, title]
                  properties:
                    slot_id: { type: string }
                    type: { type: string, enum: [activity, dining, nightlife, transport, hotel] }
                    start: { type: string }
                    end: { type: string }
                    title: { type: string }
                    checked: { type: boolean }
                    why_short: { type: string, nullable: true }
                    citations: { type: array, items: { type: string }, nullable: true }
                    recommendation:
                      $ref: '#/components/schemas/SlotRecommendation'

    SlotStatusPatchRequest:
      type: object
      properties:
        checked: { type: boolean }

    SlotStatusPatchResponse:
      type: object
      required: [slot_id, checked]
      properties:
        slot_id: { type: string }
        checked: { type: boolean }

    SlotOverridesPatchRequest:
      type: object
      properties:
        do:
          type: string
          maxLength: 90
          nullable: true
          description: Plain text only; no markup/HTML
          pattern: "^[^<>]*$"
        prepare:
          type: string
          maxLength: 90
          nullable: true
          description: Plain text only; no markup/HTML
          pattern: "^[^<>]*$"
        notice:
          type: string
          maxLength: 90
          nullable: true
          description: Plain text only; no markup/HTML
          pattern: "^[^<>]*$"
      additionalProperties: false

    SlotOverridesPatchResponse:
      type: object
      required: [slot_id]
      properties:
        slot_id: { type: string }
        recommendation:
          $ref: '#/components/schemas/SlotRecommendation'

    SearchPoiItem:
      type: object
      required: [poi_id, name, address]
      properties:
        poi_id: { type: string }
        name: { type: string }
        address: { type: string }
        distance_m: { type: integer, nullable: true }
        latitude: { type: number, format: double, minimum: -90, maximum: 90, nullable: true }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, nullable: true }

    CandidateAddRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lng: { type: number, format: double, nullable: true }

    CandidateAddResponse:
      type: object
      required: [candidate_id]
      properties:
        candidate_id: { type: string }

    SetHotelRequest:
      type: object
      required: [plan_id, hotel_poi_id]
      properties:
        plan_id: { type: string }
        hotel_poi_id: { type: string }

    # --- Validator & Fix (descriptive schemas; no new endpoints required) ---
    ValidatorConflictType:
      type: string
      description: Feasibility conflict type detected by Validator
      enum: [no_coords, closed, cross_day_unreachable, too_far, overtime, open_gap_short, transport_boundary, hotel_boundary]

    ConflictSeverity:
      type: string
      enum: [hard, soft]

    ValidatorConflict:
      type: object
      description: A single conflict with optional fix suggestions
      required: [type, severity]
      properties:
        type: { $ref: '#/components/schemas/ValidatorConflictType' }
        severity: { $ref: '#/components/schemas/ConflictSeverity' }
        day: { type: integer, nullable: true }
        slot_id: { type: string, nullable: true }
        details:
          type: object
          additionalProperties: true
        suggestions:
          type: array
          items: { $ref: '#/components/schemas/FixSuggestion' }
      example:
        type: too_far
        severity: soft
        day: 2
        slot_id: s_abc
        details:
          commute_minutes: 28
          limit_minutes: 18
        suggestions:
          - id: fix_1
            conflict_type: too_far
            safe: true
            requires_user_input: false
            score: 0.87
            actions:
              - type: reorder
                notes: "Swap with previous slot to reduce commute"
            apply_sequence:
              - op: move
                slot_id: s_abc
                new_day: 2
                new_start: "14:00"
                new_end: "16:00"
              - op: move
                slot_id: s_prev
                new_day: 2
                new_start: "16:00"
                new_end: "18:00"
          - id: fix_2
            conflict_type: too_far
            safe: true
            requires_user_input: true
            score: 0.81
            actions:
              - type: replace_with_alternative
                notes: "Use nearer candidate"
            apply_sequence:
              - op: replace
                slot_id: s_abc
                replace_with_poi_id: poi_nearby_1

    FixActionType:
      type: string
      description: High-level fix strategy
      enum: [reorder, move, retime, shorten_stay, replace_with_alternative, shift_day, align_to_boundary, suggest_insert_candidate]

    FixAction:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/FixActionType' }
        notes: { type: string, nullable: true }

    FixAtomicOperation:
      type: object
      description: |
        Atomic operations map to existing APIs:
        - move/retime/replace/delete → PATCH /plan/slots/{slot_id}
        - set_hotel → PATCH /plan/days/{day}/hotel
      required: [op]
      properties:
        op:
          type: string
          enum: [move, retime, replace, delete, set_hotel]
        slot_id: { type: string, nullable: true }
        day: { type: integer, nullable: true }
        new_day: { type: integer, nullable: true }
        new_start: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', nullable: true }
        new_end: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', nullable: true }
        replace_with_poi_id: { type: string, nullable: true }
        hotel_poi_id: { type: string, nullable: true }

    FixSuggestion:
      type: object
      required: [id, conflict_type, actions]
      properties:
        id: { type: string }
        conflict_type: { $ref: '#/components/schemas/ValidatorConflictType' }
        safe: { type: boolean, description: 'Does not modify frozen selected anchors or time hints' }
        requires_user_input: { type: boolean, description: 'Needs user to pick an alternative or candidate' }
        score: { type: number, format: double, description: 'Higher is better; deterministic tie-break' }
        actions:
          type: array
          items: { $ref: '#/components/schemas/FixAction' }
        apply_sequence:
          type: array
          description: Ordered atomic ops to apply using existing endpoints
          items: { $ref: '#/components/schemas/FixAtomicOperation' }
      example:
        id: fix_1
        conflict_type: too_far
        safe: true
        requires_user_input: false
        score: 0.87
        actions:
          - type: reorder
            notes: "Swap with previous slot to reduce commute"
        apply_sequence:
          - op: move
            slot_id: s_abc
            new_day: 2
            new_start: "14:00"
            new_end: "16:00"

  responses:
    Error400:
      description: Bad Request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error403:
      description: Forbidden
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error404:
      description: Not Found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error409:
      description: Conflict (Optimistic locking / idempotency)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error429:
      description: Too Many Requests (rate limited)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error503:
      description: Required authoritative store or provider unavailable; unknown external results remain unknown.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Error500:
      description: Internal Server Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
