packages:
  - apps/*
  - packages/*

allowBuilds:
  # Worker updates are explicit and checked; never copy a worker on install.
  msw: false
  # Published dist is ready to use. Its installer only selects typings on Node10/12.
  '@alicloud/openapi-core': false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  puppeteer: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - puppeteer

# T0 audit: patched resolutions only for the new lint dependency chain.
overrides:
  "eslint-plugin-jsx-a11y@6.10.2>minimatch": 3.1.5
  "minimatch@3.1.5>brace-expansion": 1.1.18
