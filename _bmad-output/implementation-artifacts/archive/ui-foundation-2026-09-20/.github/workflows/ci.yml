name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nomad_auth_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d nomad" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RATE_LIMIT_WINDOW_MS: 60000
      SSE_IDLE_TIMEOUT_MS: 30000
      SSE_HEARTBEAT_MS: 10000
      DATABASE_URL: postgresql://user:pass@localhost:5432/nomad_auth_test_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI types
        run: pnpm run ci:types

      - name: Validate BMAD handoff
        run: pnpm run ci:handoff

      - name: Handoff regression
        run: node --test scripts/check-handoff.test.mjs

      - name: Build workspace
        run: pnpm run ci:build

      - name: Apply Prisma migrations to isolated CI database
        run: pnpm -F nomad-prisma run migrate:deploy

      - name: Authentication unit and API contract tests
        run: node --import tsx --test apps/server/src/auth/*.test.ts scripts/check-auth-contract.test.mjs

      - name: Ingest state and command contracts
        run: node --import tsx --test apps/server/src/ingest/*.test.ts scripts/check-ingest-dock-contract.test.mjs

      - name: Recovery reader and backup helper counterexamples
        run: |
          node --import tsx --test apps/server/scripts/benchmark-stream.test.ts
          python3 -m unittest discover -s ops/postgres -p 'test_*.py'
          python3 ops/pve-staging/test_bounded_process.py

      - name: Persistent authentication with explicit provider substitutes
        env:
          AUTH_TEST_DATABASE_ACK: isolated-synthetic-only
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/prisma/tests/auth-migration-seed.sql
          node --import tsx apps/server/scripts/auth-persistence-probe.ts
          node --import tsx apps/server/scripts/auth-http-probe.ts
          node --import tsx apps/server/scripts/auth-ingest-probe.ts

      - name: Mobile tests
        run: pnpm run ci:mobile

      - name: Home and Library contract probe
        run: pnpm run ci:home-library

      - name: Planner contract probe
        run: pnpm run ci:planner

      - name: Settings contract probe
        run: pnpm run ci:settings

      - name: Install Puppeteer Chrome
        run: pnpm -F nomad-server exec puppeteer browsers install chrome

      - name: Start explicit fixture server for legacy contract probes
        env:
          AUTH_RUNTIME_MODE: test
          AUTH_PROVIDER: fixture
          AUTH_TEST_ADAPTER_ENABLED: 'true'
          AUTH_PUBLIC_ORIGIN: http://localhost:5173
        run: |
          pnpm run ci:start-server &
          echo $! > server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Health check
        run: curl -fsS http://localhost:3000/health

      - name: Synthetic probe (ACK)
        run: pnpm run ci:probe

      - name: SSE assertions (TTFU/keepalive)
        run: pnpm run ci:sse

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
