# Included only for nomad-test.yinianyunqi.top from NPM custom/http.conf.
server {
    listen 80;
    server_name nomad-test.yinianyunqi.top;
    location / { return 301 https://nomad-test.yinianyunqi.top$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nomad-test.yinianyunqi.top;
    ssl_certificate /data/nginx/custom/nomad/tls/current/fullchain.pem;
    ssl_certificate_key /data/nginx/custom/nomad/tls/current/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 2m;
    proxy_hide_header Server;

    location = /api { return 404; }
    location /api/ {
        proxy_pass http://172.17.0.1:25245/;
        proxy_http_version 1.1;
        proxy_set_header Host nomad-test.yinianyunqi.top;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host nomad-test.yinianyunqi.top;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    location / { return 404; }
    access_log /data/logs/nomad-phone_access.log;
    error_log /data/logs/nomad-phone_error.log warn;
}
