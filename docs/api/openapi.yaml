openapi: 3.0.3
info:
  title: nomad-mvp API
  version: 1.0.0
  description: |
    Core asynchronous workflows with SSE. Latency SLOs are user-perceived:
    ACK (HTTP accept), TTFU (first SSE event), Keep-alive (max gap ≤10s).
servers:
  - url: https://api.example.com
    description: Example server (replace in deployment)
tags:
  - name: Ingest
  - name: Plans
  - name: Export
  - name: SSE
  - name: Auth
  - name: Sessions
  - name: BYOK
  - name: ResultSheet
  - name: Search
  - name: Feedback
  - name: Home
  - name: Library
paths:
  /home/input/parse:
    post:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Home]
      summary: Classify unified Home input into ingest, trip params, or unknown
      operationId: parseHomeInput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HomeInputParseRequest'
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '409': { $ref: '#/components/responses/Error409' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Input classification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeInputParseResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '429': { $ref: '#/components/responses/Error429' }
        '500': { $ref: '#/components/responses/Error500' }

  /library/cities:
    get:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Library]
      summary: List user-owned inspiration city aggregates
      operationId: listLibraryCities
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: City aggregates for the authenticated user's inspirations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCitiesResponse'
        '401': { $ref: '#/components/responses/Error401' }
        '500': { $ref: '#/components/responses/Error500' }

  /library/inspirations:
    get:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Library]
      summary: List user-owned inspirations for Home and Library
      operationId: listLibraryInspirations
      parameters:
        - in: query
          name: city_id
          schema: { type: string }
        - in: query
          name: locate_status
          schema: { type: string, enum: [resolved, pending] }
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Inspiration list for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryInspirationsResponse'
        '401': { $ref: '#/components/responses/Error401' }
        '500': { $ref: '#/components/responses/Error500' }

  /library/inspirations/{inspiration_id}/candidates:
    get:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Library]
      summary: List sanitized pending-location candidates for an inspiration
      operationId: listLibraryCandidates
      parameters:
        - in: path
          name: inspiration_id
          required: true
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Top-5 sanitized candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCandidatesResponse'
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /ingest/start:
    post:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Ingest]
      summary: Start ingest of a single Xiaohongshu link (async)
      operationId: startIngest
      deprecated: true
      description: Use POST /ingest/xhs instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestStartRequest'
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '409': { $ref: '#/components/responses/Error409' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '202':
          description: Accepted; ingest job created
          headers:
            X-Trace-Id:
              description: Correlation id for tracing
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestStartResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '429': { $ref: '#/components/responses/Error429' }
        '500': { $ref: '#/components/responses/Error500' }

  /ingest/xhs:
    post:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Ingest]
      summary: Start ingest by Xiaohongshu share link (async)
      operationId: ingestXhs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestXhsRequest'
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '409': { $ref: '#/components/responses/Error409' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '202':
          description: Accepted; ingest job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestAcceptedResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '429': { $ref: '#/components/responses/Error429' }
        '500': { $ref: '#/components/responses/Error500' }

  /ingest/{job_id}:
    get:
      tags: [Ingest]
      operationId: readIngestSnapshot
      security: [{ SessionAuth: [] }, { BearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '200':
          description: Current owner-qualified committed facts, without redispatching existing work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestSnapshot' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
        '503': { $ref: '#/components/responses/Error503' }

  /ingest/{job_id}/recovery:
    get:
      tags: [Ingest]
      operationId: recoverIngestProgress
      description: Owner-qualified recovery without job creation or redispatch. A legacy job may adopt one current-fact log checkpoint. Replay does not acknowledge the head. Explicit resync requires no cursor in either header or query and returns one atomic authoritative snapshot/cursor pair. If both cursor sources are supplied, they must match exactly; malformed, duplicate or conflicting values are rejected after ownership validation.
      security: [{ SessionAuth: [] }, { BearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - in: header
          name: Last-Event-ID
          schema: { $ref: '#/components/schemas/IngestCursor' }
        - in: query
          name: last_event_id
          schema: { $ref: '#/components/schemas/IngestCursor' }
        - in: query
          name: mode
          schema: { type: string, enum: [replay, resync], default: replay }
      responses:
        '200':
          description: Replay from a confirmed cursor or explicitly replace a missing/expired checkpoint with the supplied authoritative pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestRecoveryResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
        '503': { $ref: '#/components/responses/Error503' }

  /ingest/{job_id}/result:
    get:
      tags: [Ingest]
      operationId: readIngestResult
      security: [{ SessionAuth: [] }, { BearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '200':
          description: Current owner-qualified committed facts, without redispatching existing work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LibraryInspirationItem' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
        '503': { $ref: '#/components/responses/Error503' }

  /ingest/{job_id}/retry:
    post:
      tags: [Ingest]
      operationId: retryIngestJob
      security: [{ SessionAuth: [] }, { BearerAuth: [] }]
      parameters:
        - in: path
          name: job_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - $ref: '#/components/parameters/RequestOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestRetryRequest' }
      responses:
        '200':
          description: Current owner-qualified committed facts, without redispatching existing work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAcceptedResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
        '503': { $ref: '#/components/responses/Error503' }

  /ingest/commands/{operation_id}:
    get:
      tags: [Ingest]
      operationId: readIngestCommand
      security: [{ SessionAuth: [] }, { BearerAuth: [] }]
      parameters:
        - in: path
          name: operation_id
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '200':
          description: Current owner-qualified committed facts, without redispatching existing work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAcceptedResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
        '503': { $ref: '#/components/responses/Error503' }

  /ingest/{job_id}/events:
    get:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [SSE]
      summary: SSE stream for ingest job events (alias path)
      operationId: ingestEvents
      description: Durable ingest replay then database tail. Conflicting header/query cursors are rejected. Business frames use cursor id and IngestDurableEvent; ingest_control carries resync/complete without id. Heartbeats are comments at most 10 seconds apart and never advance a business cursor. Clients must persist applied facts before acknowledging a cursor.
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { $ref: '#/components/schemas/IngestCursor' }
        - in: query
          name: last_event_id
          schema: { $ref: '#/components/schemas/IngestCursor' }
        - $ref: '#/components/parameters/StreamExpectedOwner'
        - $ref: '#/components/parameters/StreamExpectedSession'
        - in: path
          name: job_id
          required: true
          schema: { type: string }
      responses:
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                example:
                  value: |
                    id: i1:11111111-1111-4111-8111-111111111111:1
                    event: ingest
                    data: {"schema_version":1,"kind":"fact","seq":"1","cursor":"i1:11111111-1111-4111-8111-111111111111:1","trace_id":"33333333-3333-4333-8333-333333333333","ingest_id":"ing_22222222-2222-4222-8222-222222222222","state":"created","stage":"created","occurred_at":"2026-09-19T00:00:00.000Z","attempt":1,"state_version":0,"snapshot":{"ingest_id":"ing_22222222-2222-4222-8222-222222222222","attempt":1,"state_version":0,"state":"created","source_title":null,"result":null,"partial":false,"retriable":false,"updated_at":"2026-09-19T00:00:00.000Z","actions":{"retry":false,"view":false},"head_cursor":"i1:11111111-1111-4111-8111-111111111111:1"},"ts":1789776000000}

                    : heartbeat
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /sse/ingest/{ingest_id}:
    get:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [SSE]
      summary: SSE stream for ingest job events
      operationId: sseIngest
      deprecated: true
      description: Durable ingest replay then database tail. Conflicting header/query cursors are rejected. Business frames use cursor id and IngestDurableEvent; ingest_control carries resync/complete without id. Heartbeats are comments at most 10 seconds apart and never advance a business cursor. Clients must persist applied facts before acknowledging a cursor.
      parameters:
        - in: header
          name: Last-Event-ID
          schema: { $ref: '#/components/schemas/IngestCursor' }
        - in: query
          name: last_event_id
          schema: { $ref: '#/components/schemas/IngestCursor' }
        - in: path
          name: ingest_id
          required: true
          schema: { type: string }
      responses:
        '400': { $ref: '#/components/responses/Error400' }
        '409': { $ref: '#/components/responses/Error409' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Server-Sent Events stream
          headers:
            Cache-Control:
              schema: { type: string }
            X-Trace-Id:
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE business data conforms to IngestDurableEvent; ingest_control has no id and conforms to IngestControl.
              examples:
                example:
                  value: |
                    id: i1:11111111-1111-4111-8111-111111111111:1
                    event: ingest
                    data: {"schema_version":1,"kind":"fact","seq":"1","cursor":"i1:11111111-1111-4111-8111-111111111111:1","trace_id":"33333333-3333-4333-8333-333333333333","ingest_id":"ing_22222222-2222-4222-8222-222222222222","state":"created","stage":"created","occurred_at":"2026-09-19T00:00:00.000Z","attempt":1,"state_version":0,"snapshot":{"ingest_id":"ing_22222222-2222-4222-8222-222222222222","attempt":1,"state_version":0,"state":"created","source_title":null,"result":null,"partial":false,"retriable":false,"updated_at":"2026-09-19T00:00:00.000Z","actions":{"retry":false,"view":false},"head_cursor":"i1:11111111-1111-4111-8111-111111111111:1"},"ts":1789776000000}

                    : heartbeat
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /plan/generate:
    post:
      tags: [Plans]
      summary: Generate day-level skeleton (partial fill) asynchronously
      operationId: planGenerate
      security:
        - SessionAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, minLength: 8, maxLength: 128 }
          description: Reuse only when retrying the same planning submission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanGenerateRequest'
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '202':
          description: Accepted; plan job created
          headers:
            X-Trace-Id:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanGenerateResponse'
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '409': { $ref: '#/components/responses/Error409' }
        '429': { $ref: '#/components/responses/Error429' }
        '500': { $ref: '#/components/responses/Error500' }

  /sse/plan/{plan_job_id}:
    get:
      tags: [SSE]
      summary: SSE stream for plan generation events
      operationId: ssePlan
      security:
        - SessionAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/StreamExpectedOwner'
        - $ref: '#/components/parameters/StreamExpectedSession'
        - $ref: '#/components/parameters/StreamCursor'
        - in: path
          name: plan_job_id
          required: true
          schema: { type: string }
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '401': { $ref: '#/components/responses/Error401' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Server-Sent Events stream for plan phases
          content:
            text/event-stream:
              schema: { type: string }
              examples:
                example:
                  value: |
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"started","ts":1730000000}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"freeze","ts":1730000001}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"selected_anchor","ts":1730000002}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"quota","ts":1730000003}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"candidates","ts":1730000004}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"place","ts":1730000005}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"validate","ts":1730000006}
                    event: plan
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","phase":"persist","ts":1730000007}
                    event: anchors_ready
                    data: {"trace_id":"t-1","plan_job_id":"pj_1","city":"HZ","season":"autumn","tod":"evening","ready":true}

  /plan/{plan_id}/slots/{slot_id}:
    patch:
      tags: [Plans]
      summary: Edit an owned timeline slot with optimistic locking
      operationId: editPlanSlot
      security:
        - SessionAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - in: path
          name: plan_id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: slot_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlotEditRequest' }
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Slot edited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlotEditResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /plan/{plan_id}/recent-actions:
    get:
      tags: [Plans]
      summary: Get the latest effective edit available from the recent-actions entry
      operationId: getPlanRecentAction
      security:
        - SessionAuth: []
        - BearerAuth: []
      parameters:
        - in: path
          name: plan_id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: day_index
          schema: { type: integer, minimum: 0, maximum: 13 }
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Latest eligible recent action, if any
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanRecentActionResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }

  /plan/{plan_id}/edits/undo:
    post:
      tags: [Plans]
      summary: Undo the latest eligible timeline edit
      operationId: undoPlanEdit
      security:
        - SessionAuth: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
        - in: path
          name: plan_id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanEditUndoRequest' }
      responses:
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '200':
          description: Edit undone into a new immutable plan version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanEditUndoResponse' }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }

  /plan/ai-fill:
    post:
      security:
        - SessionAuth: []
        - BearerAuth: []
      tags: [Plans]
      summary: Start one-shot AI fill over remaining controllable slots (async)
      operationId: aiFill
      deprecated: true
      description: Use POST /fill/apply instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiFillRequest'
      parameters:
        - $ref: '#/components/parameters/RequestOrigin'
        - $ref: '#/components/parameters/ExpectedUser'
        - $ref: '#/components/parameters/ExpectedSession'
      responses:
        '409': { $ref: '#/components/responses/Error409' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
