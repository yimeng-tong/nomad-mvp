source_obligations:
  login-attribution:
    requirements:
      - FR14
      - NFR6
    story_keys:
      - 1-0-production-login-and-multi-device-sessions
    source: docs/prd.md
    source_heading: '### 1) 账号与合规（首屏登录影响）'
    task: 1.0承接Web/PWA、Android与iOS的真实首次打开/注册/登录/恢复、U-App/U-Link、隐私选择、稳定owner绑定与切换清理；消费9.1宿主，不记录秘密/原始来源，不把App可用当纯Web统计已接通。
    evidence: 双端实际安装候选及适用Web路径的真实能力/供应商事件查询与失败证据；Key/SDK/wrapper不算接通，未核验保留未验收。
  input-attribution:
    requirements:
      - FR14
      - FR2
      - FR3
      - NFR6
    story_keys:
      - 1-6-home-multi-link-import-queue-and-honest-status
    source: docs/prd.md
    source_heading: '### 2) 统一输入与深链'
    task: >-
      准备1.6时把已有冷启动深链/用户触发粘贴、登录后恢复同一动作、渠道/点击标识最小归因的适用能力与隐私边界写入Tasks及验收；不自动读剪贴板或因重放重复启动导入。
      本期Android/iOS冷暖启动深链与用户主动粘贴分别验收，重复/进程重建不重交任务。
    evidence: 合法/失效/跨owner/登录中断/重复深链、剪贴板拒绝恢复与适用宿主真实集成证据；未接通明确未完成。复用1.0身份与现有输入，不等待8.1总览。
  analytics-consolidation:
    requirements:
      - FR14
      - NFR6
    story_keys:
      - 8-1-cross-flow-observability-and-fault-localization
    source: docs/prd.md
    source_heading: '### 10) 观测与质量'
    task: >-
      8.1复核并汇总先前1.0/1.6等首次消费的U-App事件/归因和METRICS-01字典、窗口、脱敏及失败覆盖；不把友盟要求静默替换为Sentry/Langfuse。 按Web/Android/iOS、App build/Web
      bundle与实际分母拆分，核验JS/native桥接双计数和原生故障符号。
    evidence: 真实已启用宿主与配置/回执及失败路径；无法获得服务证据保持未验收。无新平台、移动运营页或提前部署要求。
  map-copyright:
    requirements:
      - NFR7
    story_keys:
      - 2-7-full-city-picker-and-l3-place-intent
    source: docs/prd.md
    source_heading: '### 11) 法务与上架'
    task: 2.7首个统一AMap地图容器承接Logo/版权等适用地图级展示与弱网列表降级；普通POI/候选/交通卡不逐卡增加版权徽标。
    evidence: 按当前获准SDK/宿主核验地图容器截图及实际要求，保留2.8/2.10既有普通卡片边界。
  app-build-delivery:
    requirements:
      - FR52
      - NFR25
    story_keys:
      - 9-1-capacitor-app-installation-and-host-foundation
      - 9-2-android-apk-and-ios-testflight-delivery
    source: docs/prd.md
    source_heading: '## Capacitor 首期交付（2026-09-19 已批准）'
    task: 9.1提供可安装宿主与明确构建/设备矩阵；9.2完成签名APK、指定测试组实际可用TestFlight与安装升级、完整跨端证据，网页保持。
    evidence: 原生/Web构建输入、真实设备安装/交互、最终候选/签名安全引用、TestFlight可用与有效期；源码/配置/模拟器/IPA/上传受理均非完成证明。
selection_rules:
  prepare: 按获批preparation_order（9.1→原队列→9.2）选择首个未准备合同，包括暂停继承3.1；准备与开发/关闭依赖分开。
  develop: 排除所有paused=true项；只接受有当前合同并获本次相应授权的ready-for-dev或未暂停in-progress项；旧2.2文件永不派发。
  inherited_contract: >-
    新3.1准备时保留development_status=in-progress；实施文件Status同为in-progress，另置contract_ready=true，开始条件满足前paused=true保持。不得为兼容通用create-story先降为backlog/ready。
  snapshot_vs_live: 2026-09-15 migration的authorization/execution_state是SP时点快照；当前授权与逐Story工程条件进展在sprint-status维护，不能永久锁在false/not-started。
  scope: 用户2026-09-19已授权当前MVP持续准备/开发/验证/审阅，合理决策先落盘；仅不可绕过必要凭据/资源阻断对应工作，独立工作持续。授权记录不构成功能验收。
