<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8faf7" />
    <title>Nomad</title>
    <style>
      #nomad-startup { margin: 12vh auto; max-width: 28rem; padding: 24px; color: #17211b; background: #f8faf7; font: 16px/1.65 system-ui,sans-serif; }
      #nomad-startup h1 { font-size: 1.5rem; }
      #nomad-startup a { display: inline-block; padding: 12px 0; min-height: 44px; color: #247e6f; }
    </style>
  </head>
  <body>
    <div id="root"><main id="nomad-startup">
      <h1 id="nomad-startup-title">正在打开 Nomad</h1>
      <p>如果停留在此页面，请检查网络并更新浏览器。Nomad 支持 Safari / iOS 16.4+、Firefox 128+、Chrome / Edge 111+。</p>
      <noscript><p>请启用 JavaScript 后重新打开。</p></noscript>
      <a href="./">重新打开</a>
    </main></div>
    <script>
      // ES5 bootstrap remains readable when the modern module cannot be parsed.
      (function () {
        var ua = navigator.userAgent;
        var ios = /(?:iPhone|iPad|iPod).*OS (\d+)_(\d+)/.exec(ua);
        var safari = /Version\/(\d+)\.(\d+).*Safari\//.exec(ua);
        var firefox = /Firefox\/(\d+)/.exec(ua);
        var chromium = /(?:Chrome|Chromium|Edg)\/(\d+)/.exec(ua);
        var version = ios || (!chromium && !firefox ? safari : null);
        var old = version && (+version[1] < 16 || (+version[1] === 16 && +version[2] < 4));
        if (old || (firefox && +firefox[1] < 128) || (chromium && +chromium[1] < 111)
            || !window.CSS || !CSS.supports('color', 'oklch(50% 0.1 120)') || !CSS.supports('selector(:has(*))')) {
          document.documentElement.setAttribute('data-nomad-unsupported', 'true');
          document.getElementById('nomad-startup-title').textContent = '请更新浏览器后打开 Nomad';
        }
      }());
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
