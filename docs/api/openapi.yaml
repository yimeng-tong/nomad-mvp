        '401': { $ref: '#/components/responses/Error401' }

components:
  parameters:
    RequestOrigin:
      in: header
      name: Origin
      required: true
      description: Exact configured browser origin required on unsafe requests; never derived from Host or forwarded headers.
      schema: { type: string }
    ExpectedUser:
      in: header
      name: X-Auth-User-Id
      required: false
      description: Required for authenticated browser resource requests. Login/OTP requests use anonymous when the initiating page is unauthenticated. Expected owner from the initiating page; only compared AFTER real session authentication, never a credential or an identity selector.
      schema: { type: string, maxLength: 128 }
    NativeAudience:
      in: header
      name: X-Nomad-Auth-Audience
      required: true
      description: Native fixed API origin. HTTPS required; browser Origin and Cookie are rejected.
      schema: { type: string, format: uri }
    NativeBinding:
      in: header
      name: X-Nomad-Login-Binding
      required: true
      description: Secret generated and retained by the native plugin. Never available to JavaScript or logs.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    StreamExpectedOwner:
      in: query
      name: auth_user_id
      description: Web EventSource expected public owner reference; never a credential.
      schema: { type: string }
    StreamExpectedSession:
      in: query
      name: auth_session_id
      description: Web EventSource expected public session reference; never a credential.
      schema: { type: string }
    StreamCursor:
      in: query
      name: last_event_id
      description: Last delivered attempt and sequence for browser reconnect; Last-Event-ID header takes precedence.
      schema: { type: string, maxLength: 128 }
    ExpectedSession:
      in: header
      name: X-Auth-Session-Id
      required: false
      description: Required for authenticated browser resource requests. Login/OTP requests use anonymous when the initiating page is unauthenticated. Public session reference from the initiating page; stale or mismatched context returns AUTH_CONTEXT_CHANGED (409).
      schema: { type: string, maxLength: 128 }
  securitySchemes:
    SessionAuth:
      type: apiKey
      in: cookie
      name: __Host-nomad-sid-{public_session_id}
      description: HttpOnly Secure cookie family. Each login writes a distinct public-session suffix; delayed login/logout responses cannot overwrite newer credentials. The suffix is public and never authenticates without the opaque cookie value.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Native only. Requires HTTPS, X-Nomad-Auth-Audience matching AUTH_API_ORIGIN, and no Origin or Cookie. The credential is held by the native plugin and is never returned to JavaScript.
  schemas:
    FeedbackLinkResponse:
        type: object
        required: [url]
        properties:
          url: { type: string, format: uri }

    AccountTaskResponse:
      type: object
      required: [task_id, status]
      properties:
        task_id: { type: string }
        status: { type: string, enum: [queued, in_progress, done, failed] }

    UserKeyStatusResponse:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        provider: { type: string, nullable: true }
        key_ref: { type: string, nullable: true }

    ByokValidateRequest:
      type: object
      required: [key]
      properties:
        key: { type: string, minLength: 1 }

    ByokValidateResponse:
      type: object
      required: [valid]
      properties:
        valid: { type: boolean }
        provider: { type: string, nullable: true }

    ByokSaveRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          minLength: 8
          pattern: '^\S+$'
        provider: { type: string, enum: [openai], nullable: true }

    LoginMethod:
      type: object
      required: [id, label, type, enabled]
      properties:
        id: { type: string, enum: [phone, apple, wechat] }
        label: { type: string }
        type: { type: string, enum: [phone, third_party] }
        provider: { type: string, nullable: true }
        enabled: { type: boolean }

    AuthCaptchaConfig:
      type: object
      required: [provider, mode]
      properties:
        provider: { type: string, enum: [tencent, aliyun-pnvs, fixture] }
        mode: { type: string, enum: [off, risk, always] }
        app_id: { type: string, nullable: true, description: Public graphic H5 identifier only; no appKey or cloud credential. }
        sdk_url: { type: string, nullable: true, description: Server-approved H5 SDK asset URL. }

    PnvsCaptchaProof:
      type: object
      additionalProperties: false
      required: [lot_number, captcha_output, pass_token, gen_time]
      properties:
        lot_number: { type: string, minLength: 1, maxLength: 128 }
        captcha_output: { type: string, minLength: 1, maxLength: 4096 }
        pass_token: { type: string, minLength: 1, maxLength: 1024 }
        gen_time: { type: string, minLength: 1, maxLength: 32 }

    OperatorGrant:
      type: object
      required: [capability, scope, version]
      properties:
        capability: { type: string, enum: [places.correct, brand.rules, ops.workbench, ops.prompts, ops.rollout, ops.usage] }
        scope: { type: string, minLength: 1, maxLength: 128 }
        version: { type: integer, minimum: 1 }
    OperatorAccessResponse:
      type: object
      required: [user_id, grants]
      properties:
        user_id: { type: string, format: uuid }
        grants: { type: array, items: { $ref: '#/components/schemas/OperatorGrant' } }
    OperatorAccessCheckRequest:
      type: object
      additionalProperties: false
      required: [capability, scope, expected_grant_version, operation_id]
      properties:
        capability: { type: string, enum: [places.correct, brand.rules, ops.workbench, ops.prompts, ops.rollout, ops.usage] }
        scope: { type: string, minLength: 1, maxLength: 128 }
        expected_grant_version: { type: integer, minimum: 1 }
        operation_id: { type: string, format: uuid }
    OperatorAccessCheckResponse:
      type: object
      required: [receipt_id, verified_at]
      properties:
        receipt_id: { type: string, format: uuid }
        verified_at: { type: string, format: date-time }

    AuthConfigResponse:
      type: object
      required: [privacy_url, user_agreement_url, enabled_methods, ios_equal_weight_order, captcha]
      properties:
        privacy_url: { type: string }
        user_agreement_url: { type: string }
        availability: { type: string, enum: [ready, unavailable, fixture] }
        enabled_methods:
          type: array
          items: { $ref: '#/components/schemas/LoginMethod' }
        ios_equal_weight_order:
          type: array
          items: { type: string, enum: [apple, phone, wechat] }
        captcha: { $ref: '#/components/schemas/AuthCaptchaConfig' }

    NativeOtpVerifyResponse:
      description: Internal HTTPS response consumed only by the native plugin. The plugin stores and strips the credential before resolving any JavaScript promise.
      allOf:
        - $ref: '#/components/schemas/OtpVerifyResponse'
        - type: object
          required: [native_session_credential]
          properties:
            native_session_credential: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }

    OtpStartRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 6, maxLength: 32, pattern: '^\+?[0-9][0-9 -]{4,30}[0-9]$' }
        region: { type: string, minLength: 2, maxLength: 8, pattern: '^[A-Z]{2,8}$', default: CN }
        request_id: { type: string, format: uuid, description: Required in real mode; one browser intent retains this ID across an unknown-result retry. }
        captcha: { $ref: '#/components/schemas/PnvsCaptchaProof' }
        captcha_token: { type: string, minLength: 1, maxLength: 2048, nullable: true, description: Legacy isolated fixture only; never accepted as real PNVS proof. }

    OtpStartResponse:
      type: object
      required: [sent, retry_after_sec, captcha_required]
      properties:
        sent: { type: boolean, description: Provider accepted this send; does not prove handset delivery or login. }
        retry_after_sec: { type: integer, minimum: 1 }
        challenge_id: { type: string, format: uuid, nullable: true }
        delivery_state: { type: string, enum: [sent, unknown, captcha_required] }
        captcha_required: { type: boolean }
        captcha_provider: { type: string, nullable: true, enum: [tencent, aliyun-pnvs, fixture] }

    OtpVerifyRequest:
      type: object
      description: Accepts otp or the compatibility alias code; when both are supplied they must match (validated by the server). Real mode requires the server-issued challenge_id and its HttpOnly browser-binding cookie. Device fields are metadata only.
      required: [phone]
      anyOf:
        - required: [otp]
        - required: [code]
      properties:
        phone: { type: string, minLength: 6, maxLength: 32, pattern: '^\+?[0-9][0-9 -]{4,30}[0-9]$' }
        challenge_id: { type: string, format: uuid }
        otp: { type: string, minLength: 4, maxLength: 12 }
        code: { type: string, minLength: 4, maxLength: 12 }
        device_fingerprint: { type: string, minLength: 1, maxLength: 128 }
        device_id: { type: string, minLength: 1, maxLength: 128, description: Compatibility alias for device_fingerprint. }

    Session:
      type: object
      required: [id, device_id, expires_at]
      properties:
        id: { type: string, description: Public session reference; not a cookie credential and never usable to authenticate. }
        device_id: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [operation_id]
      properties:
        operation_id: { type: string, format: uuid, description: One browser-generated operation ID reused for recovery of the same logout, never a login credential. }

    SessionResponse:
      type: object
      required: [user, session]
      properties:
        user:
          type: object
          required: [id]
          properties:
            id: { type: string }
            phone: { type: string, nullable: true }
        session: { $ref: '#/components/schemas/Session' }

    CurrentUserResponse:
      type: object
      required: [user_id, user, session]
      properties:
        user_id: { type: string }
        user:
          type: object
          required: [id]
          properties:
            id: { type: string }
            phone: { type: string, nullable: true }
        session: { $ref: '#/components/schemas/Session' }

    OtpVerifyResponse:
      type: object
