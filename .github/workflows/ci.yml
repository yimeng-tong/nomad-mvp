name: CI

on:
  push:
    branches: [ main, codex/story-9-4-workbench-quality, codex/story-9-5-browser-gates, codex/story-9-3-shared-ui, codex/story-1-0-auth-measurements ]
  pull_request:
    branches: [ main, codex/story-1-0-production-auth, codex/story-9-4-workbench-quality, codex/story-9-5-browser-gates ]

jobs:
  browser-environment:
    name: Canonical browser environment and product entry
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --user pwuser
    env:
      NOMAD_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      pnpm_config_verify_deps_before_run: error
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Verify actual engine runtimes and fonts
        run: node apps/mobile/scripts/browser-environment.mjs
      - name: Generate API types and check browser suite types
        run: |
          pnpm run ci:types
      - name: Build the actual controlled product entry
        env:
          NOMAD_RECORD_PRODUCT_GRAPH: '1'
          VITE_API_BASE_URL: /api
        run: pnpm -F nomad-mobile run build
      - name: Current product scenarios in all three engines
        run: pnpm run ci:browser
      - name: Browser network guard counterexamples
        run: node apps/mobile/scripts/check-browser-network-guards.mjs
      - name: Product privacy recovery and pixel counterexamples
        run: node apps/mobile/scripts/check-browser-flow-guards.mjs
      - name: Missing coverage baseline environment and auto-update counterexamples
        run: node apps/mobile/scripts/check-browser-validation-guards.mjs
      - name: Private shared UI lifecycle in all three actual browser engines
        run: node apps/mobile/scripts/check-shared-ui-matrix.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nomad-browser-environment-${{ github.sha }}
          path: apps/mobile/.browser-results/
          include-hidden-files: true
          if-no-files-found: error

  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: nomad_auth_test_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U user -d nomad" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RATE_LIMIT_WINDOW_MS: 60000
      SSE_IDLE_TIMEOUT_MS: 30000
      SSE_HEARTBEAT_MS: 10000
      DATABASE_URL: postgresql://user:pass@localhost:5432/nomad_auth_test_ci
      REDIS_URL: redis://localhost:6379
      STORYBOOK_DISABLE_TELEMETRY: '1'
      pnpm_config_verify_deps_before_run: error
      CODE_QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CODE_QUALITY_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Generate OpenAPI types
        run: pnpm run ci:types

      - name: Generate Prisma client for typed checks
        run: pnpm -F nomad-prisma run generate

      - name: Validate BMAD handoff
        run: pnpm run ci:handoff

      - name: Handoff regression
        run: node --test scripts/check-handoff.test.mjs

      - name: Typed lint with explicit comparison and frozen coverage
        run: pnpm run ci:lint

      - name: Lint gate counterexamples
        run: pnpm run ci:lint:negative

      - name: Build workspace
        env:
          NOMAD_RECORD_PRODUCT_GRAPH: '1'
        run: pnpm run ci:build

      - name: Install locked component Chromium and Chinese fonts
        run: |
          pnpm -F nomad-mobile exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Workbench types, static build, shared network handlers, interaction and accessibility
        run: pnpm run ci:workbench

      - name: Actual component and network counterexamples
        run: pnpm run ci:workbench:negative

      - name: Sync controlled native project resources and inspect complete inventories
        env:
          NOMAD_NATIVE_ENV: development
        run: |
          pnpm -F nomad-mobile run native:sync
          pnpm -F nomad-mobile run native:verify
          pnpm run ci:workbench:isolation

      - name: Preserve component and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomad-workbench-${{ github.sha }}
          path: |
            apps/mobile/.workbench-results/
            apps/mobile/storybook-static/index.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Apply Prisma migrations to isolated CI database
        run: pnpm -F nomad-prisma run migrate:deploy

      - name: Authentication unit and API contract tests
        run: node --import tsx --test apps/server/src/auth/*.test.ts scripts/check-auth-contract.test.mjs

      - name: Ingest state and command contracts
        run: node --import tsx --test apps/server/src/ingest/*.test.ts scripts/check-ingest-dock-contract.test.mjs

      - name: Recovery reader and backup helper counterexamples
        run: |
          node --import tsx --test apps/server/scripts/benchmark-stream.test.ts apps/server/scripts/sse-probe-reader.test.ts scripts/sse-assert.test.mts
          python3 -m unittest discover -s ops/postgres -p 'test_*.py'
          python3 ops/pve-staging/test_bounded_process.py

      - name: Persistent authentication with explicit provider substitutes
        working-directory: apps/server
        timeout-minutes: 3
        env:
          AUTH_TEST_DATABASE_ACK: isolated-synthetic-only
          REDIS_TEST_ACK: isolated-synthetic-only
        run: |
          node --import tsx scripts/redis-lifecycle-probe.ts
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f ../../packages/prisma/tests/auth-migration-seed.sql
          node --import tsx scripts/auth-persistence-probe.ts
          node --import tsx scripts/auth-http-probe.ts
          node --import tsx scripts/auth-ingest-probe.ts

      - name: Mobile tests
        run: pnpm run ci:mobile

      - name: Authentication and import measurement contracts
        run: |
          pnpm run ci:auth-measurements
          pnpm run ci:import-measurements

      - name: Home and Library contract probe
        run: pnpm run ci:home-library

      - name: Planner contract probe
        run: pnpm run ci:planner

      - name: Settings contract probe
        run: pnpm run ci:settings

      - name: Install Puppeteer Chrome
        run: pnpm -F nomad-server exec puppeteer browsers install chrome

      - name: Actual isolated authentication workload and cutoff
        run: |
          AUTH_MEASUREMENT_OUTPUT=.measurement-results/auth/matrix pnpm run measure:auth matrix
          AUTH_MEASUREMENT_OUTPUT=.measurement-results/auth/cutoff pnpm run measure:auth deadline-cutoff
          pnpm run measure:auth-report .measurement-results/auth/matrix/samples.json .measurement-results/auth/matrix/recomputed.json
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const base = '.measurement-results/auth/matrix/';
          const report = JSON.parse(readFileSync(base + 'report.json', 'utf8'));
          const recomputed = JSON.parse(readFileSync(base + 'recomputed.json', 'utf8'));
          assert.deepEqual(recomputed, { overall: report.overall, scenarios: report.scenarios });
          JS

      - name: Authentication measurement cutoff visibility and failure evidence counterexamples
        run: pnpm run ci:auth-measurements:negative

      - name: Preserve isolated authentication measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomad-auth-measurement-${{ github.sha }}
          path: .measurement-results/auth/
          include-hidden-files: true
          if-no-files-found: error

      - name: Start explicit fixture server for legacy contract probes
        env:
          AUTH_RUNTIME_MODE: test
          AUTH_PROVIDER: fixture
          AUTH_TEST_ADAPTER_ENABLED: 'true'
          AUTH_PUBLIC_ORIGIN: http://localhost:5173
          INGEST_WORKER_MODE: enabled
          INGEST_RECOVERY_ISOLATED: 'false'
        run: |
          pnpm run ci:start-server &
          echo $! > server.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Health check
        run: curl -fsS http://localhost:3000/health

      - name: Synthetic probe (ACK)
        run: pnpm run ci:probe

      - name: SSE assertions (TTFU/keepalive)
        run: pnpm run ci:sse

      - name: Stop server
        if: always()
        run: |
          if [ -f server.pid ]; then kill "$(cat server.pid)" || true; fi
