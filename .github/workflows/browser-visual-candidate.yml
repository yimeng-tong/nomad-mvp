name: Browser visual candidates

on:
  push:
    branches: [ 'codex/story-9-5-visual-candidate-*' ]

permissions:
  contents: read

jobs:
  candidate:
    name: Generate unapproved canonical visual candidates
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      options: --user pwuser
    env:
      NOMAD_BROWSER_IMAGE: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:bc6ab0d6d44ff4826e4cb8c1e6d801e185bfc42bb0753f8e2a30efc70db054c7
      NOMAD_BROWSER_RUN_KIND: candidate
      pnpm_config_verify_deps_before_run: error
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: node apps/mobile/scripts/browser-environment.mjs
      - run: |
          pnpm run ci:types
          pnpm -F nomad-mobile run typecheck:browser
      - name: Build current product for explicit candidate ref
        env:
          NOMAD_RECORD_PRODUCT_GRAPH: '1'
          VITE_API_BASE_URL: /api
        run: pnpm -F nomad-mobile run build
      - name: Generate candidates in all three engines without accepting baselines
        run: pnpm -F nomad-mobile run test:browser --grep 'V[0-9][0-9] '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-9-5-visual-candidates-${{ github.sha }}
          path: apps/mobile/.browser-results/
          include-hidden-files: true
          if-no-files-found: error
